# Package discovery is automatic. This file records only exceptions to the
# default policy: build every package, push its result to Attic, and update it
# with `nix-update --flake <name> --version=<preference>`.

[cache]
# raft-computer still runs in CI. Its SEA payload already comes from an
# upstream CDN, so mirroring the final output in our internal cache adds little
# value compared with the storage it consumes.
exclude = ["raft-computer"]

[update]
# Only self-contained, flake-aware custom updaters belong here. In particular,
# do not add the generic `nix-update-script { }` injected by package builders:
# invoking that through `--use-update-script` loses the outer `--flake` mode.
script = ["origin", "plannotator", "raft-computer"]

# Default-path packages whose GitHub releases.atom is too short or flooded
# with prereleases for `--version=stable`. CI passes `--use-github-releases`
# so nix-update can page the releases API (and honor the prerelease flag).
github-releases = ["fff-mcp"]

# These packages either describe repository-local artifacts or cannot expose a
# source location that nix-update can safely rewrite. They remain CI-built; this
# list excludes only the automated update workflow.
exclude = [
  "avenir",
  "claude-hud",
  "forester",
  "hello-world",
  "opendal-oli",
  "paseo",
  "wotfard",
]

# These packages use the normal flake updater but have no stable release stream.
unstable = ["drive9", "jj-ryu"]
