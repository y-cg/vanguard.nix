# Package discovery is automatic. This file records only exceptions to the
# default policy: build every package, push its result to Attic, and update it
# with `nix-update --flake <name> --version=<preference>`.

[cache]
# check build in CI but do not push to cache
exclude = ["origin"]

[update]
# Only self-contained, flake-aware custom updaters belong here. In particular,
# do not add the generic `nix-update-script { }` injected by package builders:
# invoking that through `--use-update-script` loses the outer `--flake` mode.
script = ["origin"]

# passes `--use-github-releases`
github-releases = ["fff-mcp"]

exclude = [
  "avenir",
  "claude-hud",
  "forester",
  "hello-world",
  "opendal-oli",
  "pdf2htmlex",
]

# Have no stable release stream. Excluded from the daily update schedule to conserve 
# CI cache and must be updated manually via workflow dispatch (version=unstable).
unstable = ["jj-ryu"]
