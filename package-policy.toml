# Per-package CI and update policy. Read only by scripts/ci.py.
#
# Every flake package uses [defaults] unless it has its own table. A table may
# set any field below. Unknown packages, unknown keys, and invalid values fail
# the CI run.
#
#   cache   "push"  build in CI and upload to Attic
#           "skip"  build in CI, never upload
#
#   update  "nix-update"       nix-update --flake <pkg> --version=<track>
#           "github-releases"  as nix-update, plus --use-github-releases
#           "update-script"    nix-update --use-update-script (the package's own updater)
#           "manual"           never updated automatically
#
#   track   "stable"    updated by the daily schedule
#           "unstable"  updated only by a manual dispatch with version=unstable

[defaults]
cache = "push"
update = "nix-update"
track = "stable"

[origin]
cache = "skip"
update = "update-script"

[fff-mcp]
update = "github-releases"

[jj-ryu]
# No stable release stream.
track = "unstable"

[avenir]
update = "manual"

[claude-hud]
update = "manual"

[forester]
update = "manual"

[hello-world]
update = "manual"

[opendal-oli]
update = "manual"

[pdf2htmlex]
update = "manual"
