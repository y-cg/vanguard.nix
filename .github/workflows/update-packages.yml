name: Update packages

# One job, no matrix: updates run one after another and open one pull request
# per package. Building the pull request is CI's job, not this workflow's.
# How each package is updated is defined in package-policy.toml and run by
# `scripts/ci.py update-all`.
#
#   schedule           every stable-track package
#   workflow_dispatch  every package on the chosen track (dry_run publishes nothing)

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run updates without pushing or opening pull requests
        type: boolean
        default: false
      version:
        description: Release track to update
        type: choice
        options:
          - stable
          - unstable
        default: stable

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Update packages (${{ inputs.version || 'stable' }})
    runs-on: ubuntu-latest
    env:
      TRACK: ${{ inputs.version || 'stable' }}
      DRY_RUN: ${{ inputs.dry_run == true }}
      # nix-update's update scripts still import <nixpkgs>.
      NIX_PATH: nixpkgs=flake:nixpkgs
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        uses: ./.github/actions/setup

      - name: Install nix-update
        run: nix profile install nixpkgs#nix-update

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update packages
        run: |
          args=(--track "$TRACK")
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          uv run --project scripts scripts/ci.py update-all "${args[@]}"
