name: CI

# plan   asks scripts/ci.py which packages this change touches
# build  one job per (package, system), on the platform's native runner
# gate   ci-success, the only required check; accepts "nothing to build"
#
# Each built package is pushed to Attic unless package-policy.toml says cache = "skip".

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      packages:
        description: Comma-separated packages to build (manual runs build nothing else)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Supersede stale pull-request runs; never cancel a push to the default branch.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan builds
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The plan diffs base...head, so it needs the base commit's history.
          fetch-depth: 0

      - name: Install tools
        uses: ./.github/actions/setup

      - name: Select packages
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          PACKAGES: ${{ github.event.inputs.packages }}
        run: |
          matrix=$(uv run --project scripts scripts/ci.py build-matrix \
            --event "$EVENT" --base "$BASE" --head "$HEAD" --packages "$PACKAGES")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$(jq '.include | length' <<< "$matrix")" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.package }} (${{ matrix.system }})
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        uses: ./.github/actions/setup
        with:
          attic: "true"
          attic-endpoint: ${{ secrets.ATTIC_ENDPOINT }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          attic-cache: ${{ secrets.ATTIC_CACHE }}

      - name: Build
        env:
          ATTR: .#packages.${{ matrix.system }}.${{ matrix.package }}
        run: |
          # Retry transient fetch and substituter failures. --fallback rebuilds
          # from source when a substituted NAR is truncated.
          for attempt in 1 2 3; do
            if out=$(nix build "$ATTR" --no-link --print-out-paths --print-build-logs --fallback); then
              printf '%s\n' "$out" > "$RUNNER_TEMP/out-paths"
              exit 0
            fi
            echo "::warning::build attempt $attempt failed"
            sleep 15
          done
          exit 1

      - name: Push to Attic
        if: matrix.cache == 'push'
        env:
          ATTIC_CACHE: ${{ secrets.ATTIC_CACHE }}
        run: |
          mapfile -t paths < "$RUNNER_TEMP/out-paths"
          attic push "central:$ATTIC_CACHE" "${paths[@]}"

  ci-success:
    name: ci-success
    needs: [plan, build]
    # always(): report a verdict even when a dependency failed or was skipped,
    # so the required check never stays unresolved.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify
        env:
          PLAN: ${{ needs.plan.result }}
          BUILD: ${{ needs.build.result }}
          COUNT: ${{ needs.plan.outputs.count }}
        run: |
          echo "plan=$PLAN build=$BUILD selected=$COUNT"
          fail() { echo "::error::CI did not pass: $1"; exit 1; }
          [ "$PLAN" = success ] || fail "plan is $PLAN"
          case "$BUILD" in
            success) ;;
            # Skipped is correct only when the plan selected nothing.
            skipped) [ "$COUNT" = 0 ] || fail "build was skipped with $COUNT packages selected" ;;
            *) fail "build is $BUILD" ;;
          esac
