name: Build comment

# A pull request comment that starts with "build <package>" dispatches CI for
# that package on the pull request's branch, then replies with a link to the
# runs. Only owners, members, and collaborators can trigger it. Pull requests
# from forks are refused, since their code cannot run with our secrets.
#
# GitHub reads this file from the default branch, so it takes effect after merge.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  dispatch:
    name: Dispatch build
    if: >-
      github.event.issue.pull_request &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      startsWith(github.event.comment.body, 'build')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      issues: write
      pull-requests: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.issue.number }}
      BODY: ${{ github.event.comment.body }}
    steps:
      - name: Parse the command
        id: parse
        run: |
          # Only the first line counts, and it must be exactly "build <package>".
          line=$(printf '%s\n' "$BODY" | head -n1 | tr -d '\r')
          if [[ "$line" =~ ^build[[:space:]]+([A-Za-z0-9._+-]+)[[:space:]]*$ ]]; then
            echo "package=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          fi

      - name: Look up the pull request
        id: pr
        if: steps.parse.outputs.package != ''
        run: |
          info=$(gh pr view "$PR" --repo "$REPO" --json headRefName,isCrossRepository)
          echo "branch=$(jq -r .headRefName <<< "$info")" >> "$GITHUB_OUTPUT"
          echo "fork=$(jq -r .isCrossRepository <<< "$info")" >> "$GITHUB_OUTPUT"

      - name: Refuse pull requests from forks
        if: steps.parse.outputs.package != '' && steps.pr.outputs.fork == 'true'
        run: |
          gh pr comment "$PR" --repo "$REPO" \
            --body "CI dispatch does not support pull requests from forks."

      # Check out the default branch, not the pull request: the package list
      # comes from trusted code. The dispatched run builds the pull request.
      - name: Check out repository
        if: steps.parse.outputs.package != '' && steps.pr.outputs.fork != 'true'
        uses: actions/checkout@v4

      - name: Install tools
        if: steps.parse.outputs.package != '' && steps.pr.outputs.fork != 'true'
        uses: ./.github/actions/setup

      - name: Check that the package exists
        id: check
        if: steps.parse.outputs.package != '' && steps.pr.outputs.fork != 'true'
        env:
          PKG: ${{ steps.parse.outputs.package }}
        run: |
          if ! err=$(uv run --project scripts scripts/ci.py build-matrix \
            --event workflow_dispatch --packages "$PKG" 2>&1 >/dev/null); then
            gh pr comment "$PR" --repo "$REPO" \
              --body "Unknown package \`$PKG\`: $err"
            exit 1
          fi

      - name: Dispatch CI on the pull request's branch
        if: steps.parse.outputs.package != '' && steps.pr.outputs.fork != 'true'
        env:
          PKG: ${{ steps.parse.outputs.package }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          # ci.yml's link job comments this run's URL on the pull request.
          gh workflow run ci.yml --repo "$REPO" --ref "$BRANCH" -f packages="$PKG" -f pr="$PR"
